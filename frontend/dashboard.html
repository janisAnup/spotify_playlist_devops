<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Playlist</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <header class="topbar">
      <h1>Playlist Generator Dashboard</h1>
      <div class="top-actions">
        <button id="profileBtn" type="button">Check Profile</button>
        <button id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <section class="welcome-card">
      <h2>Welcome</h2>
      <p>
        Build a personalized playlist based on mood, genre, vibe, and song count.
      </p>
      <div id="profileBox" class="profile-box"></div>
    </section>

    <section class="form-card">
      <h2>Create Your Playlist</h2>

      <form id="playlistForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="mood">Mood</label>
            <select id="mood" required>
              <option value="">Select mood</option>
              <option value="happy">Happy</option>
              <option value="sad">Sad</option>
              <option value="chill">Chill</option>
              <option value="romantic">Romantic</option>
              <option value="energetic">Energetic</option>
              <option value="focus">Focus</option>
            </select>
          </div>

          <div class="form-group">
            <label for="genre">Genre</label>
            <select id="genre" required>
              <option value="">Select genre</option>
              <option value="pop">Pop</option>
              <option value="indie">Indie</option>
              <option value="rock">Rock</option>
              <option value="hip hop">Hip Hop</option>
              <option value="k-pop">K-Pop</option>
              <option value="bollywood">Bollywood</option>
              <option value="lofi">Lo-fi</option>
            </select>
          </div>

          <div class="form-group">
            <label for="count">Number of Songs</label>
            <select id="count">
              <option value="5">5 songs</option>
              <option value="10">10 songs</option>
              <option value="15">15 songs</option>
              <option value="20">20 songs</option>
            </select>
          </div>

          <div class="form-group">
            <label for="visibility">Playlist Visibility</label>
            <select id="visibility">
              <option value="false" selected>Private</option>
              <option value="true">Public</option>
            </select>
          </div>
        </div>

        <div class="radio-group">
          <label>Vibe Style</label>
          <div class="radio-options">
            <label><input type="radio" name="vibe" value="soft" checked /> Soft</label>
            <label><input type="radio" name="vibe" value="party" /> Party</label>
            <label><input type="radio" name="vibe" value="dreamy" /> Dreamy</label>
            <label><input type="radio" name="vibe" value="intense" /> Intense</label>
          </div>
        </div>

        <button id="createBtn" type="submit" class="create-btn">Create Playlist</button>
      </form>

      <div id="result" class="result-box"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
