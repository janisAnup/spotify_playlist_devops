services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      PORT: 5000
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
